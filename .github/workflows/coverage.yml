name: Coverage Badge

on:
  push:
    branches: [main]
    paths:
      - '3_1_LLM_agent/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - '3_1_LLM_agent/**'

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 3_1_LLM_agent

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done
          ollama pull qwen3-vl:2b
      - name: Warm up Ollama model
        run: |
          ollama run qwen3-vl:2b "ping" >/dev/null || true

      - name: Create .env file
        run: |
          echo "PG_HOST=localhost" > .env
          echo "PG_PORT=5432" >> .env
          echo "PG_DATABASE=testdb" >> .env
          echo "PG_USER=postgres" >> .env
          echo "PG_PASSWORD=postgres" >> .env
          echo "OLLAMA_BASE_URL=http://localhost:11434" >> .env
          echo "OLLAMA_MODEL=qwen3-vl:2b" >> .env
          echo "RUN_INTEGRATION=1" >> .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

      - name: Run tests with coverage
        run: |
          pytest tests/test_sql_query_tool.py tests/test_integration.py -v --cov=llm_agent.tool_sql_query --cov-report=term-missing --cov-report=xml

      - name: Get coverage percentage
        id: coverage
        run: |
          PCT=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100))")
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge Gist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: coverage.json
          label: Test Coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          color: brightgreen
          namedLogo: pytest