name: Python Tests (3_1_LLM_agent)

on:
  push:
    paths:
      - '3_1_LLM_agent/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '3_1_LLM_agent/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 3_1_LLM_agent

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        for i in $(seq 1 30); do
          curl -sf http://localhost:11434/api/version && break
          sleep 2
        done
        ollama pull qwen3-vl:2b
        ollama run qwen3-vl:2b "ping" >/dev/null || true

    - name: Create .env file
      run: |
        echo "PG_HOST=localhost" > .env
        echo "PG_PORT=5432" >> .env
        echo "PG_DATABASE=testdb" >> .env
        echo "PG_USER=postgres" >> .env
        echo "PG_PASSWORD=postgres" >> .env
        echo "OLLAMA_BASE_URL=http://localhost:11434" >> .env
        echo "OLLAMA_MODEL=qwen3-vl:2b" >> .env
        echo "RUN_INTEGRATION=1" >> .env
        echo "OPENROUTER_API_KEY=dummy_key_for_tests" >> .env

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          sleep 2
        done

    - name: Run tests with coverage
      run: |
        pytest tests/test_sql_query_tool.py tests/test_integration.py -v --cov=llm_agent.tool_sql_query --cov-report=term --cov-report=xml

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false